[build]
  command = "node build.js"
  publish = "_site"

[[headers]]
  for = "/immagini/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Vecchi indirizzi di categorie rinominate → nuovo indirizzo
[[redirects]]
  from = "/lavori-in-carta/*"
  to = "/bomboniere/"
  status = 301

[[redirects]]
  from = "/profumato/*"
  to = "/profumatori/"
  status = 301
