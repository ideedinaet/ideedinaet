<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Classifica dei «mi piace»</title>
  <style>
    :root { --testo: #2b2622; --tenue: #7a716a; --linea: #e6dfd7; --fondo: #faf7f3; --accento: #c0392b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--testo); background: var(--fondo); line-height: 1.5; }
    main { max-width: 820px; margin: 0 auto; padding: 2rem 1rem 3rem; }
    h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 0.25rem; }
    .sotto { color: var(--tenue); margin: 0 0 1.5rem; }
    .riepilogo { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem; }
    .riepilogo div { background: #fff; border: 1px solid var(--linea); border-radius: 10px; padding: 0.7rem 1rem; min-width: 150px; }
    .riepilogo b { display: block; font-size: 1.5rem; font-weight: 600; }
    .riepilogo span { color: var(--tenue); font-size: 0.85rem; }
    .barra { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
    select, button { font: inherit; font-size: 0.9rem; padding: 0.4rem 0.7rem; border: 1px solid var(--linea); border-radius: 8px; background: #fff; color: var(--testo); cursor: pointer; }
    ol { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid var(--linea); border-radius: 12px; overflow: hidden; }
    li { display: grid; grid-template-columns: 2.2rem 64px 1fr auto; gap: 0.9rem; align-items: center; padding: 0.7rem 1rem; border-top: 1px solid var(--linea); }
    li:first-child { border-top: 0; }
    .pos { font-weight: 600; color: var(--tenue); text-align: right; }
    li img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--linea); display: block; }
    .titolo { font-weight: 500; }
    .titolo a { color: inherit; text-decoration: none; }
    .titolo a:hover { text-decoration: underline; }
    .cat { color: var(--tenue); font-size: 0.85rem; }
    .conta { font-weight: 600; font-size: 1.1rem; color: var(--accento); white-space: nowrap; }
    .zero .conta { color: var(--tenue); font-weight: 400; }
    .messaggio { background: #fff; border: 1px solid var(--linea); border-radius: 12px; padding: 1rem 1.2rem; }
    details { margin-top: 1.5rem; }
    summary { cursor: pointer; color: var(--tenue); margin-bottom: 0.75rem; }
    @media (max-width: 520px) { li { grid-template-columns: 1.6rem 48px 1fr auto; gap: 0.6rem; padding: 0.6rem 0.7rem; } li img { width: 48px; height: 48px; } }
  </style>
</head>
<body>
<main>
  <h1>♥ Classifica dei «mi piace»</h1>
  <p class="sotto">I lavori più apprezzati dai visitatori del sito, in italiano e in inglese insieme. Aggiornata in tempo reale.</p>
  <div id="contenuto"><p class="messaggio">Carico la classifica…</p></div>
</main>
<script>
(function () {
  var box = document.getElementById('contenuto');
  var filtro = '';
  var dati = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function riga(l, pos) {
    return '<li' + (l.n ? '' : ' class="zero"') + '><span class="pos">' + (pos || '') + '</span>' +
      (l.foto ? '<img src="' + esc(l.foto) + '" alt="" loading="lazy">' : '<span></span>') +
      '<div><div class="titolo"><a href="' + esc(l.pagina) + '" target="_blank" rel="noopener">' + esc(l.titolo || '(senza titolo)') + '</a></div><div class="cat">' + (l.codice ? esc(l.codice) + ' · ' : '') + esc(l.categoria) + '</div></div>' +
      '<span class="conta">♥ ' + l.n + '</span></li>';
  }
  function mostra() {
    var elenco = dati.lavori.filter(function (l) { return !filtro || l.categoria === filtro; });
    var con = elenco.filter(function (l) { return l.n > 0; }).sort(function (a, b) { return b.n - a.n || a.titolo.localeCompare(b.titolo, 'it'); });
    var senza = elenco.filter(function (l) { return !l.n; });
    var totale = con.reduce(function (s, l) { return s + l.n; }, 0);
    var categorie = dati.lavori.map(function (l) { return l.categoria; }).filter(function (c, i, a) { return a.indexOf(c) === i; });
    var pos = 0, prec = null, html = '';
    html += '<div class="riepilogo"><div><b>' + totale + '</b><span>«mi piace» in tutto</span></div><div><b>' + con.length + '</b><span>lavori apprezzati</span></div><div><b>' + senza.length + '</b><span>ancora senza «mi piace»</span></div></div>';
    html += '<div class="barra"><select id="filtro"><option value="">Tutte le categorie</option>' + categorie.map(function (c) { return '<option' + (c === filtro ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select><button type="button" id="aggiorna">Aggiorna</button></div>';
    if (!dati.attivo) html += '<p class="messaggio">I «mi piace» sono spenti in <i>Impostazioni del sito</i>: i visitatori ora non vedono il cuore.</p><br>';
    if (con.length) {
      html += '<ol>' + con.map(function (l, i) { if (l.n !== prec) pos = i + 1; prec = l.n; return riga(l, pos); }).join('') + '</ol>';
    } else {
      html += '<p class="messaggio">Ancora nessun «mi piace»' + (filtro ? ' in questa categoria' : '') + '. Appena qualcuno preme il cuore su un lavoro, compare qui.</p>';
    }
    if (senza.length) html += '<details><summary>Lavori ancora senza «mi piace» (' + senza.length + ')</summary><ol>' + senza.map(function (l) { return riga(l, ''); }).join('') + '</ol></details>';
    box.innerHTML = html;
    document.getElementById('filtro').onchange = function () { filtro = this.value; mostra(); };
    document.getElementById('aggiorna').onclick = carica;
  }
  function carica() {
    Promise.all([
      fetch('classifica-lavori.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('lavori'); return r.json(); }),
      fetch('/api/mi-piace', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('conteggi'); return r.json(); }),
    ]).then(function (r) {
      var conteggi = r[1] || {};
      dati = { attivo: r[0].attivo !== false, lavori: (r[0].lavori || []).map(function (l) { l.n = Number(conteggi[l.id]) || 0; return l; }) };
      mostra();
    }).catch(function (e) {
      box.innerHTML = '<p class="messaggio">' + (String(e && e.message) === 'conteggi'
        ? 'La classifica si vede sul sito pubblicato: apritela da <b>ideedinaet.it/admin/classifica.html</b> (oppure dal pulsante ♥ Classifica nel pannello online).'
        : 'Non riesco a leggere l\'elenco dei lavori. Riprovate tra poco.') + '</p>';
    });
  }
  carica();
})();
</script>
</body>
</html>
