  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

<body>
  <script>
    // Aprendo il pannello da un altro computer (http://192.168.x.x) il browser non offre
    // crypto.randomUUID, che il pannello usa: lo ricreiamo qui. Online e su localhost non serve.
    if (window.crypto && !crypto.randomUUID && crypto.getRandomValues) {
      crypto.randomUUID = function () {
        return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function (c) {
          return (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16);
        });
      };
    }
  </script>
