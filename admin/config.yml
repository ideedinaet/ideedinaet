# Configurazione del pannello di gestione (Decap CMS)
# Il pannello si apre su: https://IL-TUO-SITO/admin/

backend:
  name: git-gateway
  branch: main

locale: it
# Bozze: «Salva» crea una bozza con anteprima gratuita; il sito vero cambia solo con «Pubblica»
publish_mode: editorial_workflow
media_folder: "immagini"
public_folder: "/immagini"

collections:
  - name: categorie
    label: "Categorie"
    label_singular: "categoria"
    description: "Ogni categoria è una pagina del sito (es. Taglieri, Lavori in carta, Profumato). Puoi crearne di nuove quando vuoi."
    folder: "content/categorie"
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: titolo
    slug: "{{slug}}"
    # Ogni categoria ha la sua cartella di foto: immagini/<nome-della-categoria>/
    # (es. immagini/bomboniere/). Si crea da sola al primo caricamento.
    media_folder: "/immagini/{{slug}}"
    public_folder: "/immagini/{{slug}}"
    sortable_fields: ["ordine", "titolo"]
    summary: "{{fields.nascosto | ternary('⛔ NASCOSTA · ', '')}}{{titolo}}"
    fields:
      - { label: "Nascondi dal sito", name: nascosto, widget: boolean, default: false, required: false, hint: "Attivo = la categoria e tutti i suoi lavori non compaiono sul sito (menu, home, Novità). Restano salvati qui e potete rimostrarli quando volete." }
      - { label: "Nome della categoria", name: titolo, widget: string, hint: "Le foto di questa categoria vanno nella cartella immagini/ con lo stesso nome (es. «Bomboniere» → immagini/bomboniere). In una categoria nuova scrivete il nome prima di caricare le foto." }
      - { label: "Posizione nel menu (1 = prima)", name: ordine, widget: number, value_type: int, default: 10, min: 1 }
      - label: "Descrizione"
        name: descrizione
        widget: markdown
        required: false
        buttons: [bold, italic]
        editor_components: []
        modes: [rich_text, raw]
        hint: "Per il grassetto o il corsivo selezionate le parole e premete G o C (oppure Ctrl+B / Ctrl+I). In modalità «Markdown» potete scrivere **grassetto** e *corsivo*."
      - { label: "Foto di copertina", name: copertina, widget: image, required: false, hint: "Se la lasci vuota uso la prima foto dei lavori." }
      - label: "In inglese (facoltativo)"
        name: en
        widget: object
        collapsed: true
        required: false
        hint: "Nome e descrizione della categoria sul sito in inglese. Se lasciate vuoto un campo, compare il testo italiano."
        fields:
          - { label: "Nome della categoria in inglese", name: titolo, widget: string, required: false }
          - { label: "Descrizione in inglese", name: descrizione, widget: markdown, required: false, buttons: [bold, italic], editor_components: [], modes: [rich_text, raw], hint: "Selezionate le parole e premete G o C per grassetto e corsivo." }
      - label: "Lavori"
        name: lavori
        widget: list
        label_singular: "lavoro"
        add_to_top: true
        # Elenco dei lavori a sinistra, lavoro selezionato a destra (vedi admin/lavori-due-colonne.js)
        due_colonne: true
        summary: "{{fields.nascosto | ternary('⛔ NASCOSTO · ', '')}}{{fields.titolo}}"
        fields:
          - { label: "Nascondi dal sito", name: nascosto, widget: boolean, default: false, required: false, hint: "Attivo = questo lavoro non compare sul sito (né nella categoria né in Novità). Resta salvato qui e potete rimostrarlo quando volete." }
          - { label: "Foto principale", name: foto, widget: image }
          - { label: "Data di inserimento", name: data, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, default: "{{now}}", required: false, hint: "Si compila da sola per i lavori nuovi. I lavori recenti compaiono in «Novità» con l'etichetta «Nuovo»." }
          - label: "Altre foto (facoltative)"
            name: altre_foto
            widget: list
            required: false
            collapsed: false
            label_singular: "foto"
            # Foto affiancate in riquadri compatti (vedi admin/lavori-due-colonne.js)
            griglia: true
            hint: "Altri dettagli o angolazioni: si vedono aprendo il lavoro in grande. Trascinate un riquadro dalla maniglia in alto per cambiare l'ordine; con la × lo eliminate (un riquadro senza foto viene comunque ignorato)."
            field: { label: "Foto", name: foto, widget: image, required: false }
          - { label: "Titolo", name: titolo, widget: string, required: false }
          - { label: "Codice", name: codice, widget: string, required: false, hint: "Codice breve del lavoro (es. BIG-02): compare nei messaggi WhatsApp e email di chi chiede informazioni, così sapete di quale lavoro si parla anche se due hanno lo stesso titolo. Se lo lasciate vuoto, si assegna da solo al salvataggio. Ogni lavoro deve avere un codice diverso." }
          - { label: "Descrizione", name: descrizione, widget: markdown, required: false, buttons: [bold, italic], editor_components: [], modes: [rich_text, raw], hint: "Selezionate le parole e premete G o C per grassetto e corsivo." }
          - { label: "Prezzo (facoltativo)", name: prezzo, widget: string, required: false, hint: "Es. 35 € — lascia vuoto per non mostrarlo." }
          - { label: "Link Instagram (facoltativo)", name: instagram, widget: string, required: false, hint: "Incolla il link del post (es. https://www.instagram.com/p/...) oppure scrivi @nomeprofilo. Sul sito diventa un link cliccabile con QR code. Se è il link di un REEL, il video si può guardare anche direttamente sul sito (etichetta «▶ Video» sulla foto)." }
          - { label: "Video YouTube (facoltativo)", name: youtube, widget: string, required: false, hint: "Incolla il link del video su YouTube (anche «non in elenco» o uno Short). Se c'è, sul sito si guarda questo video; se manca, si usa il reel di Instagram." }
          - { label: "Nascondi il video dal sito", name: nascondi_video, widget: boolean, default: false, required: false, hint: "Spento = il video (YouTube o, se manca, il reel di Instagram) si guarda direttamente sul sito, con l'etichetta «▶ Video» sulla foto. Acceso = niente video sul sito: resta solo il pulsante «Instagram»." }
          # Identificativo fisso del lavoro per i «mi piace»: lo assegna il pannello al salvataggio (admin/mi-piace.js)
          - { label: "Identificativo", name: id, widget: hidden, required: false }
          # Versione inglese (sito in /en/): campo vuoto = sul sito inglese compare il testo italiano
          - label: "In inglese (facoltativo)"
            name: en
            widget: object
            collapsed: true
            required: false
            hint: "Testi per il sito in inglese. Foto, prezzo, Instagram e video sono gli stessi. Se lasciate vuoto un campo, sul sito inglese compare il testo italiano."
            fields:
              - { label: "Titolo in inglese", name: titolo, widget: string, required: false }
              - { label: "Descrizione in inglese", name: descrizione, widget: markdown, required: false, buttons: [bold, italic], editor_components: [], modes: [rich_text, raw], hint: "Selezionate le parole e premete G o C per grassetto e corsivo." }

  - name: impostazioni
    label: "Impostazioni del sito"
    files:
      - name: sito
        label: "Informazioni generali e contatti"
        file: "content/sito.json"
        # Logo, foto della home e di «Chi siamo» stanno in immagini/sito/
        media_folder: "/immagini/sito"
        public_folder: "/immagini/sito"
        fields:
          - { label: "Nome del sito / del marchio", name: nome, widget: string }
          - label: "Tema grafico"
            name: tema
            widget: select
            default: notte
            options:
              - { label: "1 · Bottega (chiaro, carta e oro)", value: bottega }
              - { label: "2 · Catalogo (bianco, schede ordinate)", value: catalogo }
              - { label: "3 · Notte (scuro ed elegante)", value: notte }
            hint: "Cambia l'aspetto di tutto il sito. Dopo aver pubblicato, il sito si aggiorna in 1–2 minuti."
          - { label: "Logo", name: logo, widget: image, required: false, hint: "Meglio PNG con sfondo trasparente. Se vuoto, in alto compare il nome scritto." }
          - { label: "Logo per sfondo scuro (tema Notte)", name: logo_chiaro, widget: image, required: false, hint: "Versione chiara del logo. Se vuoto uso il logo normale." }
          - { label: "Barra in alto (temi Catalogo e Notte)", name: avviso, widget: string, required: false, hint: "Es. 'Ordini per Natale entro il 10 dicembre'. Se vuoto mostra i punti di forza." }
          - label: "Punti di forza"
            name: punti_forza
            widget: list
            required: false
            hint: "Brevi frasi mostrate sotto la foto principale della home (temi Catalogo e Notte), es. 'Fatto a mano'."
            field: { label: "Punto", name: testo, widget: string }
          - { label: "Frase sotto il nome", name: sottotitolo, widget: string, required: false }
          - { label: "Descrizione per Google (max ~160 caratteri)", name: descrizione_seo, widget: text, required: false }
          - { label: "Indirizzo del sito (es. https://www.nomesito.it)", name: url, widget: string, required: false, hint: "Serve per la mappa del sito che legge Google." }
          - { label: "Codice di verifica Google Search Console", name: google_verifica, widget: string, required: false, hint: "Incollate il tag HTML che dà Search Console (<meta name=\"google-site-verification\" …>) oppure solo il codice tra virgolette. Non cancellatelo dopo la verifica." }
          - { label: "Città o zona", name: citta, widget: string, required: false }
          - { label: "Foto principale della home", name: immagine_copertina, widget: image, required: false }
          - { label: "Chi siamo", name: chi_siamo, widget: markdown, required: false, buttons: [bold, italic], editor_components: [], modes: [rich_text, raw], hint: "Selezionate le parole e premete G o C per grassetto e corsivo. Andate a capo due volte per un nuovo paragrafo." }
          - { label: "Foto 'Chi siamo'", name: foto_chi_siamo, widget: image, required: false }
          - { label: "Email", name: email, widget: string, required: false }
          - label: "WhatsApp"
            name: whatsapp
            widget: list
            required: false
            label_singular: "numero"
            summary: "{{fields.nome}} · {{fields.numero}}"
            hint: "Uno o due numeri di cellulare, ognuno con il nome che compare sul pulsante (es. «WhatsApp Andrea»). Scrivete il numero completo, es. 347 1234567. Con due numeri, il visitatore sceglie a chi scrivere."
            fields:
              - { label: "Nome sul pulsante", name: nome, widget: string, required: false, hint: "Es. Andrea" }
              - { label: "Numero di cellulare", name: numero, widget: string, pattern: ['^[+0-9 ./-]{9,20}$', "Solo cifre (e spazi), es. 347 1234567"] }
          - { label: "Link Instagram", name: instagram, widget: string, required: false }
          - { label: "Link Facebook", name: facebook, widget: string, required: false }
          - { label: "Link Etsy o negozio online", name: etsy, widget: string, required: false }
          - { label: "Mostra la sezione «Novità»", name: novita_attiva, widget: boolean, default: true, required: false }
          - { label: "Mostra i «mi piace» sui lavori", name: mi_piace, widget: boolean, default: true, required: false, hint: "Un cuore su ogni lavoro: i visitatori possono mettere «mi piace». La classifica dei lavori più apprezzati è nel pulsante ♥ Classifica in alto." }
          - { label: "Mostra il numero di «mi piace» da", name: mi_piace_minimo, widget: number, value_type: int, min: 1, default: 4, required: false, hint: "Sotto questo numero si vede solo il cuore, senza numero (così un lavoro nuovo non mostra «0»). Predefinito: 4." }
          - { label: "Per quanti giorni un lavoro resta «Nuovo»", name: novita_giorni, widget: number, value_type: int, default: 30, min: 1, required: false }
          - { label: "Statistiche visite: codice GoatCounter", name: statistiche_goatcounter, widget: string, required: false, hint: "Il nome scelto su goatcounter.com (es. ideedinaet). Le visite si contano solo sul sito pubblicato." }
          - label: "Testi del sito"
            name: testi
            widget: object
            collapsed: true
            required: false
            hint: "Le scritte fisse delle pagine. Campo vuoto = testo predefinito. Scrivete solo un trattino - per nascondere la scritta."
            fields:
              - { label: "Scritta piccola sopra il titolo in home", name: occhiello_home, widget: string, required: false, default: "Fatto a mano", hint: "Se avete compilato «Città o zona», viene aggiunta dopo (es. «Fatto a mano · Italia»)." }
              - { label: "Pulsante in home", name: bottone_home, widget: string, required: false, default: "Guarda i nostri lavori" }
              - { label: "Titolo della sezione lavori in home", name: titolo_lavori, widget: string, required: false, default: "I nostri lavori" }
              - { label: "Scritta piccola sopra «Chi siamo»", name: occhiello_chi_siamo, widget: string, required: false, default: "Chi siamo" }
              - { label: "Titolo della sezione «Chi siamo»", name: titolo_chi_siamo, widget: string, required: false, default: "Due persone, quattro mani" }
              - { label: "Titolo della sezione contatti", name: titolo_contatti, widget: string, required: false, default: "Scrivici" }
              - { label: "Testo della sezione contatti", name: testo_contatti, widget: text, required: false, default: "Ti piace qualcosa o hai in mente un pezzo su misura? Contattaci, ti rispondiamo volentieri." }
              - { label: "Scritta in fondo alla pagina (dopo © anno e nome)", name: piede, widget: string, required: false, default: "Fatto a mano" }
              - { label: "Messaggio per una categoria ancora senza lavori", name: nessuna_foto, widget: string, required: false, default: "Presto nuove foto." }
              - { label: "Titolo «Novità» (menu, home e pagina)", name: titolo_novita, widget: string, required: false, default: "Novità" }
              - { label: "Testo sotto il titolo della pagina Novità", name: testo_novita, widget: string, required: false, default: "Gli ultimi lavori aggiunti, da tutte le categorie." }
              - { label: "Etichetta sui lavori nuovi", name: etichetta_nuovo, widget: string, required: false, default: "Nuovo" }
              - { label: "Scritta al posto del prezzo, se non c'è", name: prezzo_vuoto, widget: string, required: false, default: "Prezzo su richiesta", hint: "Scrivete solo un trattino - per non mostrare niente." }
              - { label: "Pulsante per chiedere informazioni su un lavoro", name: bottone_chiedi, widget: string, required: false, default: "Chiedi info", hint: "Apre WhatsApp (o l'email) con un messaggio già scritto che nomina il lavoro." }
              - { label: "Messaggio quando non ci sono novità", name: nessuna_novita, widget: string, required: false, default: "Al momento non ci sono novità: dai un'occhiata alle categorie!" }
              - { label: "Titolo della pagina «I tuoi preferiti»", name: titolo_preferiti, widget: string, required: false, default: "I tuoi preferiti" }
              - { label: "Testo sotto il titolo dei preferiti", name: testo_preferiti, widget: string, required: false, default: "I lavori a cui hai messo il cuore ♡." }
              - { label: "Messaggio quando non ci sono preferiti", name: nessun_preferito, widget: string, required: false, default: "Non hai ancora nessun preferito: premi il cuore ♡ sotto i lavori che ti piacciono e li ritroverai qui." }
              - { label: "Pulsante per chiedere info su tutti i preferiti", name: bottone_chiedi_preferiti, widget: string, required: false, default: "Chiedi info su questi lavori" }
              - { label: "Avviso sui «mi piace» e i preferiti (in fondo alle pagine)", name: nota_preferiti, widget: text, required: false, default: "I tuoi «mi piace» e i preferiti restano salvati solo in questo browser, per mostrarteli quando torni: non vengono inviati a nessuno. Il sito conta soltanto quanti «mi piace» ha ogni lavoro, senza sapere chi li ha messi." }
          # Versione inglese del sito (in /en/): campo vuoto = si usa il testo italiano
          - label: "Versione inglese del sito"
            name: en
            widget: object
            collapsed: true
            required: false
            hint: "Testi del sito in inglese (indirizzo /en/). Se lasciate vuoto un campo, compare il testo italiano. I testi dei lavori e delle categorie si scrivono nella sezione «In inglese» di ognuno."
            fields:
              - { label: "Barra in alto (temi Catalogo e Notte)", name: avviso, widget: string, required: false }
              - label: "Punti di forza"
                name: punti_forza
                widget: list
                required: false
                hint: "Se l'elenco è vuoto si usano quelli italiani."
                collapsed: false
                field: { label: "Punto", name: testo, widget: string }
              - { label: "Frase sotto il nome", name: sottotitolo, widget: string, required: false }
              - { label: "Descrizione per Google (max ~160 caratteri)", name: descrizione_seo, widget: text, required: false }
              - { label: "Città o zona", name: citta, widget: string, required: false }
              - { label: "Chi siamo", name: chi_siamo, widget: markdown, required: false, buttons: [bold, italic], editor_components: [], modes: [rich_text, raw], hint: "Selezionate le parole e premete G o C per grassetto e corsivo. Andate a capo due volte per un nuovo paragrafo." }
              - label: "Testi del sito"
                name: testi
                widget: object
                collapsed: true
                required: false
                hint: "Le scritte fisse delle pagine inglesi."
                fields:
                  - { label: "Scritta piccola sopra il titolo in home", name: occhiello_home, widget: string, required: false, hint: "Vuoto = «Handmade». Un trattino - per nascondere la scritta." }
                  - { label: "Pulsante in home", name: bottone_home, widget: string, required: false, hint: "Vuoto = «See our work». Un trattino - per nascondere la scritta." }
                  - { label: "Titolo della sezione lavori in home", name: titolo_lavori, widget: string, required: false, hint: "Vuoto = «Our work». Un trattino - per nascondere la scritta." }
                  - { label: "Scritta piccola sopra «Chi siamo»", name: occhiello_chi_siamo, widget: string, required: false, hint: "Vuoto = «About us». Un trattino - per nascondere la scritta." }
                  - { label: "Titolo della sezione «Chi siamo»", name: titolo_chi_siamo, widget: string, required: false, hint: "Vuoto = «Two people, four hands». Un trattino - per nascondere la scritta." }
                  - { label: "Titolo della sezione contatti", name: titolo_contatti, widget: string, required: false, hint: "Vuoto = «Get in touch». Un trattino - per nascondere la scritta." }
                  - { label: "Testo della sezione contatti", name: testo_contatti, widget: text, required: false, hint: "Vuoto = testo predefinito in inglese. Un trattino - per nascondere la scritta." }
                  - { label: "Scritta in fondo alla pagina (dopo © anno e nome)", name: piede, widget: string, required: false, hint: "Vuoto = «Handmade». Un trattino - per nascondere la scritta." }
                  - { label: "Messaggio per una categoria ancora senza lavori", name: nessuna_foto, widget: string, required: false, hint: "Vuoto = «New photos coming soon.». Un trattino - per nascondere la scritta." }
                  - { label: "Titolo «Novità» (menu, home e pagina)", name: titolo_novita, widget: string, required: false, hint: "Vuoto = «New». Un trattino - per nascondere la scritta." }
                  - { label: "Testo sotto il titolo della pagina Novità", name: testo_novita, widget: string, required: false, hint: "Vuoto = «The latest additions, from every category.». Un trattino - per nascondere la scritta." }
                  - { label: "Etichetta sui lavori nuovi", name: etichetta_nuovo, widget: string, required: false, hint: "Vuoto = «New». Un trattino - per nascondere la scritta." }
                  - { label: "Scritta al posto del prezzo, se non c'è", name: prezzo_vuoto, widget: string, required: false, hint: "Vuoto = «Price on request». Un trattino - per non mostrare niente." }
                  - { label: "Pulsante per chiedere informazioni su un lavoro", name: bottone_chiedi, widget: string, required: false, hint: "Vuoto = «Ask for info». Un trattino - per nascondere la scritta." }
                  - { label: "Messaggio quando non ci sono novità", name: nessuna_novita, widget: string, required: false, hint: "Vuoto = testo predefinito in inglese. Un trattino - per nascondere la scritta." }
                  - { label: "Titolo della pagina «I tuoi preferiti»", name: titolo_preferiti, widget: string, required: false, hint: "Vuoto = «Your favourites». Un trattino - per nascondere la scritta." }
                  - { label: "Testo sotto il titolo dei preferiti", name: testo_preferiti, widget: string, required: false, hint: "Vuoto = «The pieces you've hearted ♡.». Un trattino - per nascondere la scritta." }
                  - { label: "Messaggio quando non ci sono preferiti", name: nessun_preferito, widget: string, required: false, hint: "Vuoto = testo predefinito in inglese. Un trattino - per nascondere la scritta." }
                  - { label: "Pulsante per chiedere info su tutti i preferiti", name: bottone_chiedi_preferiti, widget: string, required: false, hint: "Vuoto = «Ask about these pieces». Un trattino - per nascondere la scritta." }
                  - { label: "Avviso sui «mi piace» e i preferiti (in fondo alle pagine)", name: nota_preferiti, widget: text, required: false, hint: "Vuoto = testo predefinito in inglese. Un trattino - per nascondere la scritta." }
