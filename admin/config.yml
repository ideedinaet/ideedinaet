# Configurazione del pannello di gestione (Decap CMS)
# Il pannello si apre su: https://IL-TUO-SITO/admin/

backend:
  name: git-gateway
  branch: main

locale: it
# Bozze: «Salva» crea una bozza con anteprima gratuita; il sito vero cambia solo con «Pubblica»
publish_mode: editorial_workflow
media_folder: "immagini"
public_folder: "/immagini"

collections:
  - name: categorie
    label: "Categorie"
    label_singular: "categoria"
    description: "Ogni categoria è una pagina del sito (es. Taglieri, Lavori in carta, Profumato). Puoi crearne di nuove quando vuoi."
    folder: "content/categorie"
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: titolo
    slug: "{{slug}}"
    sortable_fields: ["ordine", "titolo"]
    summary: "{{titolo}}"
    fields:
      - { label: "Nome della categoria", name: titolo, widget: string }
      - { label: "Posizione nel menu (1 = prima)", name: ordine, widget: number, value_type: int, default: 10, min: 1 }
      - { label: "Descrizione", name: descrizione, widget: text, required: false }
      - { label: "Foto di copertina", name: copertina, widget: image, required: false, hint: "Se la lasci vuota uso la prima foto dei lavori." }
      - label: "Lavori"
        name: lavori
        widget: list
        label_singular: "lavoro"
        add_to_top: true
        summary: "{{fields.titolo}}"
        fields:
          - { label: "Foto principale", name: foto, widget: image }
          - label: "Altre foto (facoltative)"
            name: altre_foto
            widget: list
            required: false
            collapsed: false
            label_singular: "foto"
            hint: "Altri dettagli o angolazioni: si vedono aprendo il lavoro in grande. Trascinale per cambiare l'ordine."
            field: { label: "Foto", name: foto, widget: image }
          - { label: "Titolo", name: titolo, widget: string, required: false }
          - { label: "Descrizione", name: descrizione, widget: text, required: false }
          - { label: "Prezzo (facoltativo)", name: prezzo, widget: string, required: false, hint: "Es. 35 € — lascia vuoto per non mostrarlo." }
          - { label: "Link Instagram (facoltativo)", name: instagram, widget: string, required: false, hint: "Incolla il link del post (es. https://www.instagram.com/p/...) oppure scrivi @nomeprofilo. Sul sito diventa un link cliccabile con QR code." }

  - name: impostazioni
    label: "Impostazioni del sito"
    files:
      - name: sito
        label: "Informazioni generali e contatti"
        file: "content/sito.json"
        fields:
          - { label: "Nome del sito / del marchio", name: nome, widget: string }
          - label: "Tema grafico"
            name: tema
            widget: select
            default: notte
            options:
              - { label: "1 · Bottega (chiaro, carta e oro)", value: bottega }
              - { label: "2 · Catalogo (bianco, schede ordinate)", value: catalogo }
              - { label: "3 · Notte (scuro ed elegante)", value: notte }
            hint: "Cambia l'aspetto di tutto il sito. Dopo aver pubblicato, il sito si aggiorna in 1–2 minuti."
          - { label: "Logo", name: logo, widget: image, required: false, hint: "Meglio PNG con sfondo trasparente. Se vuoto, in alto compare il nome scritto." }
          - { label: "Logo per sfondo scuro (tema Notte)", name: logo_chiaro, widget: image, required: false, hint: "Versione chiara del logo. Se vuoto uso il logo normale." }
          - { label: "Barra in alto (temi Catalogo e Notte)", name: avviso, widget: string, required: false, hint: "Es. 'Ordini per Natale entro il 10 dicembre'. Se vuoto mostra i punti di forza." }
          - label: "Punti di forza"
            name: punti_forza
            widget: list
            required: false
            hint: "Brevi frasi mostrate sotto la foto principale della home (temi Catalogo e Notte), es. 'Fatto a mano'."
            field: { label: "Punto", name: testo, widget: string }
          - { label: "Frase sotto il nome", name: sottotitolo, widget: string, required: false }
          - { label: "Descrizione per Google (max ~160 caratteri)", name: descrizione_seo, widget: text, required: false }
          - { label: "Indirizzo del sito (es. https://www.nomesito.it)", name: url, widget: string, required: false, hint: "Serve per la mappa del sito che legge Google." }
          - { label: "Città o zona", name: citta, widget: string, required: false }
          - { label: "Foto principale della home", name: immagine_copertina, widget: image, required: false }
          - { label: "Chi siamo", name: chi_siamo, widget: text, required: false }
          - { label: "Foto 'Chi siamo'", name: foto_chi_siamo, widget: image, required: false }
          - { label: "Email", name: email, widget: string, required: false }
          - { label: "Telefono / WhatsApp", name: telefono, widget: string, required: false }
          - { label: "Link Instagram", name: instagram, widget: string, required: false }
          - { label: "Link Facebook", name: facebook, widget: string, required: false }
          - { label: "Link Etsy o negozio online", name: etsy, widget: string, required: false }
          - label: "Testi del sito"
            name: testi
            widget: object
            collapsed: true
            required: false
            hint: "Le scritte fisse delle pagine. Campo vuoto = testo predefinito. Scrivete solo un trattino - per nascondere la scritta."
            fields:
              - { label: "Scritta piccola sopra il titolo in home", name: occhiello_home, widget: string, required: false, default: "Fatto a mano", hint: "Se avete compilato «Città o zona», viene aggiunta dopo (es. «Fatto a mano · Italia»)." }
              - { label: "Pulsante in home", name: bottone_home, widget: string, required: false, default: "Guarda i nostri lavori" }
              - { label: "Titolo della sezione lavori in home", name: titolo_lavori, widget: string, required: false, default: "I nostri lavori" }
              - { label: "Scritta piccola sopra «Chi siamo»", name: occhiello_chi_siamo, widget: string, required: false, default: "Chi siamo" }
              - { label: "Titolo della sezione «Chi siamo»", name: titolo_chi_siamo, widget: string, required: false, default: "Due persone, quattro mani" }
              - { label: "Titolo della sezione contatti", name: titolo_contatti, widget: string, required: false, default: "Scrivici" }
              - { label: "Testo della sezione contatti", name: testo_contatti, widget: text, required: false, default: "Ti piace qualcosa o hai in mente un pezzo su misura? Contattaci, ti rispondiamo volentieri." }
              - { label: "Scritta in fondo alla pagina (dopo © anno e nome)", name: piede, widget: string, required: false, default: "Fatto a mano" }
              - { label: "Messaggio per una categoria ancora senza lavori", name: nessuna_foto, widget: string, required: false, default: "Presto nuove foto." }
